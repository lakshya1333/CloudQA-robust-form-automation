<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Original replica</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; }
  .well { border: 1px solid #ccc; padding: 16px; margin-bottom: 24px; background: #f7f7f7; }
  .form-group { margin-bottom: 12px; }
  .col-xs-6 { width: 48%; display: inline-block; vertical-align: top; }
  .col-xs-12 { width: 100%; }
  label.control-label { display: block; font-weight: bold; }
  .note { color: #555; font-size: 13px; }
</style>
</head>
<body>
<p class="note">Variant: Original replica &mdash; same structure as app.cloudqa.io/home/AutomationPracticeForm, including the Shadow DOM duplicate form and the hidden modal</p>

<div class="container">
<form method="post" class="well" id="automationtestform" action="#">
  <div class="row">
    <div class="col-xs-12"><h2>Form</h2></div>
    <div class="form-group col-xs-6">
      <label for="fname" name="fname" class="control-label">First Name</label>
      <input id="fname" type="text" name="First Name" class="form-control" placeholder="Name" data-expect="firstName" />
    </div>
    <div class="form-group col-xs-6">
      <label for="lname" name="lname" class="control-label">Last Name</label>
      <input id="lname" type="text" name="Last Name" class="form-control" placeholder="Surname" />
    </div>
    <div class="form-group col-xs-6">
      <label class="control-label">Gender</label>
      <div class="col-lg-12">
        <input id="male" type="radio" name="gender" value="Male" />
        <span name="male" for="male" class="control-label">Male</span>
        <input id="female" type="radio" name="gender" value="Female" data-expect="gender" />
        <span name="female" for="female" class="control-label">Female</span>
        <input id="transgender" type="radio" name="gender" value="Transgender" />
        <span name="transgender" for="female" class="control-label">Transgender</span>
      </div>
    </div>
    <div class="form-group col-xs-6">
      <label for="dob" name="dob" class="control-label">Date of Birth</label>
      <input id="dob" type="text" name="Date of Birth" placeholder="YYYY-MM-DD" class="form-control" />
    </div>
    <div class="form-group col-xs-6">
      <label name="mobile" for="mobile" class="control-label">Mobile #</label>
      <input id="mobile" name="Mobile Number" class="form-control" type="number" placeholder="Mobile Number" />
    </div>
    <div class="form-group col-xs-6">
      <label name="email" for="email" class="control-label">Email</label>
      <input id="email" type="text" name="Email" class="form-control" placeholder="Email" />
    </div>
    <div class="autocomplete form-group col-xs-6">
      <label name="Country" for="country" class="control-label"> Country </label>
      <input id="country" type="text" name="Country" placeholder="Country" class="form-control" />
    </div>
    <div class="form-group col-xs-6">
      <label name="State" for="state" class="control-label"> State </label>
      <select class="form-control" id="state" name="State" data-expect="state">
            <option>-- Select Country --</option>
            <option value="Afganistan">Afganistan</option>
            <option value="Argentina">Argentina</option>
            <option value="Australia">Australia</option>
            <option value="Bangladesh">Bangladesh</option>
            <option value="Belgium">Belgium</option>
            <option value="Canada">Canada</option>
            <option value="Cuba">Cuba</option>
            <option value="Denmark">Denmark</option>
            <option value="Egypt">Egypt</option>
            <option value="Finland">Finland</option>
            <option value="France">France</option>
            <option value="Germany">Germany</option>
            <option value="Greece">Greece</option>
            <option value="Greenland">Greenland</option>
            <option value="Hong Kong">Hong Kong</option>
            <option value="India">India</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Italy">Italy</option>
            <option value="Japan">Japan</option>
            <option value="Kenya">Kenya</option>
            <option value="Malaysia">Malaysia</option>
            <option value="Mexico">Mexico</option>
            <option value="Nepal">Nepal</option>
            <option value="Netherlands">Netherlands</option>
            <option value="Philippines">Philippines</option>
            <option value="Russia">Russia</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="Singapore">Singapore</option>
            <option value="Turkey">Turkey</option>
            <option value="United Arab Emirates">United Arab Emirates</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="United States">United States</option>
            <option value="Zimbabwe">Zimbabwe</option>
      </select>
    </div>
    <div class="form-group col-xs-12">
      <label class="control-label">Hobbies</label>
      <input type="checkbox" id="Dance" value="Dance" name="Hobbies" /><span>Dance</span>
      <input type="checkbox" id="Reading" value="Reading" name="Hobbies" /><span>Reading</span>
      <input type="checkbox" id="Cricket" value="Cricket" name="Hobbies" /><span>Cricket</span>
    </div>
    <div class="form-group col-xs-12">
      <label class="control-label">About Yourself</label>
      <textarea class="form-control" rows="3" placeholder="About Yourself" name="About"></textarea>
    </div>
  </div>
  <div class="row">
    <input type="text" class="form-control" placeholder="Username" name="Username" />
    <input type="password" class="form-control" placeholder="Password" name="Password" />
    <input type="checkbox" id="Agree" value="Agree" name="Agree" /> I agree to <a href="#">terms</a>
  </div>
  <button class="btn btn-primary" type="submit">Submit</button>
  <button class="btn btn-primary" type="reset">Reset</button>
</form>

<form method="post" class="well" id="shadowdomautomationtestform" action="#">
  <h1>Shadow DOM</h1>
  <shadow-form></shadow-form>
</form>
</div>

<div class="modal fade" id="exampleModal" style="display:none">
  <form>
    <label for="recipient-name" class="control-label">Recipient:</label>
    <input type="text" class="form-control" id="recipient-name">
  </form>
</div>

<script>
customElements.define('shadow-form', class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML = `
      <div class="form-group"><label for="fname">First Name</label><slot name="fname"></slot></div>
      <div class="form-group"><label for="lname">Last Name</label><slot name="lname"></slot></div>
      <div class="form-group"><label>Gender</label><div><slot name="gender"></slot></div></div>
      <div class="form-group"><label for="state"> State </label><slot name="statedropdown"></slot></div>`;
  }
  connectedCallback() {
    this.innerHTML = `
      <section slot="statedropdown"><select id="state" name="State">            <option>-- Select Country --</option>             <option value="Afganistan">Afganistan</option>             <option value="Argentina">Argentina</option>             <option value="Australia">Australia</option>             <option value="Bangladesh">Bangladesh</option>             <option value="Belgium">Belgium</option>             <option value="Canada">Canada</option>             <option value="Cuba">Cuba</option>             <option value="Denmark">Denmark</option>             <option value="Egypt">Egypt</option>             <option value="Finland">Finland</option>             <option value="France">France</option>             <option value="Germany">Germany</option>             <option value="Greece">Greece</option>             <option value="Greenland">Greenland</option>             <option value="Hong Kong">Hong Kong</option>             <option value="India">India</option>             <option value="Indonesia">Indonesia</option>             <option value="Italy">Italy</option>             <option value="Japan">Japan</option>             <option value="Kenya">Kenya</option>             <option value="Malaysia">Malaysia</option>             <option value="Mexico">Mexico</option>             <option value="Nepal">Nepal</option>             <option value="Netherlands">Netherlands</option>             <option value="Philippines">Philippines</option>             <option value="Russia">Russia</option>             <option value="Saudi Arabia">Saudi Arabia</option>             <option value="Singapore">Singapore</option>             <option value="Turkey">Turkey</option>             <option value="United Arab Emirates">United Arab Emirates</option>             <option value="United Kingdom">United Kingdom</option>             <option value="United States">United States</option>             <option value="Zimbabwe">Zimbabwe</option></select></section>
      <section slot="fname"><input id="fname" name="fname" type="text" placeholder="Name" /></section>
      <section slot="lname"><input id="lname" name="lname" type="text" placeholder="Name" /></section>
      <section slot="gender">
        <input id="male" type="radio" name="gender" value="Male" /><span>Male</span>
        <input id="female" type="radio" name="gender" value="Female" /><span>Female</span>
        <input id="transgender" type="radio" name="gender" value="Transgender" /><span>Transgender</span>
      </section>`;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fields inside Shadow DOM</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; }
  .well { border: 1px solid #ccc; padding: 16px; margin-bottom: 24px; background: #f7f7f7; }
  .form-group { margin-bottom: 12px; }
  .col-xs-6 { width: 48%; display: inline-block; vertical-align: top; }
  .col-xs-12 { width: 100%; }
  label.control-label { display: block; font-weight: bold; }
  .note { color: #555; font-size: 13px; }
</style>
</head>
<body>
<p class="note">Variant: Fields inside Shadow DOM &mdash; the real form lives inside an open shadow root of a custom element</p>

<profile-form></profile-form>
<script>
customElements.define('profile-form', class extends HTMLElement {
  connectedCallback() {
    this.attachShadow({ mode: 'open' }).innerHTML = `
      <form>
        <div><label for="a">Last Name</label><input id="a" type="text"></div>
        <div><label for="b">First Name</label><input id="b" type="text" data-expect="firstName"></div>
        <div><label>Gender</label>
          <input type="radio" name="g" value="Male"><span>Male</span>
          <input type="radio" name="g" value="Female" data-expect="gender"><span>Female</span></div>
        <div><label for="c">State</label><select id="c" data-expect="state">            <option>-- Select Country --</option>             <option value="Afganistan">Afganistan</option>             <option value="Argentina">Argentina</option>             <option value="Australia">Australia</option>             <option value="Bangladesh">Bangladesh</option>             <option value="Belgium">Belgium</option>             <option value="Canada">Canada</option>             <option value="Cuba">Cuba</option>             <option value="Denmark">Denmark</option>             <option value="Egypt">Egypt</option>             <option value="Finland">Finland</option>             <option value="France">France</option>             <option value="Germany">Germany</option>             <option value="Greece">Greece</option>             <option value="Greenland">Greenland</option>             <option value="Hong Kong">Hong Kong</option>             <option value="India">India</option>             <option value="Indonesia">Indonesia</option>             <option value="Italy">Italy</option>             <option value="Japan">Japan</option>             <option value="Kenya">Kenya</option>             <option value="Malaysia">Malaysia</option>             <option value="Mexico">Mexico</option>             <option value="Nepal">Nepal</option>             <option value="Netherlands">Netherlands</option>             <option value="Philippines">Philippines</option>             <option value="Russia">Russia</option>             <option value="Saudi Arabia">Saudi Arabia</option>             <option value="Singapore">Singapore</option>             <option value="Turkey">Turkey</option>             <option value="United Arab Emirates">United Arab Emirates</option>             <option value="United Kingdom">United Kingdom</option>             <option value="United States">United States</option>             <option value="Zimbabwe">Zimbabwe</option></select></div>
      </form>`;
  }
});
</script>
</body>
</html>
